<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Meal Plan</title>
<style>
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --card-alt: #FFFFFF;
  --label: #000000;
  --label-2: rgba(60,60,67,0.60);
  --label-3: rgba(60,60,67,0.30);
  --separator: rgba(60,60,67,0.29);
  --fill: rgba(120,120,128,0.12);
  --fill-2: rgba(120,120,128,0.08);
  --blue: #007AFF;
  --green: #34C759;
  --orange: #FF9500;
  --red: #FF3B30;
  --purple: #AF52DE;
  --sidebar: rgba(246,246,248,0.80);
  --radius: 10px;
  --radius-lg: 12px;
  --tabbar: rgba(249,249,249,0.94);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1C1C1E;
    --card-alt: #2C2C2E;
    --label: #FFFFFF;
    --label-2: rgba(235,235,245,0.60);
    --label-3: rgba(235,235,245,0.30);
    --separator: rgba(84,84,88,0.65);
    --fill: rgba(120,120,128,0.24);
    --fill-2: rgba(120,120,128,0.16);
    --blue: #0A84FF;
    --green: #30D158;
    --orange: #FF9F0A;
    --red: #FF453A;
    --purple: #BF5AF2;
    --sidebar: rgba(28,28,30,0.80);
    --tabbar: rgba(22,22,23,0.94);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg);
  color: var(--label);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

/* ---------- shell ---------- */
.app { display: flex; min-height: 100%; }

.sidebar {
  display: none;
  width: 260px; flex: 0 0 260px;
  position: sticky; top: 0; align-self: flex-start;
  height: 100vh;
  padding: 16px 10px;
  background: var(--sidebar);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  backdrop-filter: saturate(180%) blur(24px);
  border-right: 0.5px solid var(--separator);
}
.sidebar h1 { font-size: 15px; font-weight: 600; color: var(--label-2); margin: 6px 10px 12px; letter-spacing: -0.01em; }
.side-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; min-height: 34px; padding: 6px 10px;
  border-radius: 7px; font-size: 15px; letter-spacing: -0.01em;
}
.side-item[aria-current="page"] { background: var(--blue); color: #fff; }
.side-item[aria-current="page"] .side-glyph { opacity: 1; }
.side-glyph { width: 20px; text-align: center; font-size: 15px; opacity: 0.75; }
.is-desktop .sidebar { padding-top: 28px; }

.main { flex: 1 1 auto; min-width: 0; padding: 0 0 96px; }
.container { max-width: 720px; margin: 0 auto; padding: 0 16px; }

.largetitle {
  padding: 12px 0 2px;
  font-size: 34px; font-weight: 700; letter-spacing: -0.022em;
}
.subtitle { color: var(--label-2); font-size: 15px; margin: 2px 0 18px; }

/* ---------- grouped list ---------- */
.group { margin: 0 0 26px; }
.group-header {
  font-size: 13px; color: var(--label-2);
  padding: 0 16px 7px; letter-spacing: -0.008em;
}
.group-footer { font-size: 13px; color: var(--label-2); padding: 7px 16px 0; }
.list {
  background: var(--card);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.row {
  display: flex; align-items: center; gap: 12px;
  width: 100%; min-height: 44px;
  padding: 11px 16px;
  text-align: left;
  border-bottom: 0.5px solid var(--separator);
}
.row:last-child { border-bottom: 0; }
button.row:active { background: var(--fill-2); }
.row-main { flex: 1 1 auto; min-width: 0; }
.row-title { letter-spacing: -0.01em; }
.row-sub { font-size: 13px; color: var(--label-2); margin-top: 2px; }
.row-value { color: var(--label-2); font-size: 15px; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.chevron { color: var(--label-3); font-size: 14px; flex: 0 0 auto; }

/* ---------- check control ---------- */
.check {
  flex: 0 0 auto;
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--label-3);
  display: grid; place-items: center;
  font-size: 13px; color: #fff;
  transition: background-color .15s ease, border-color .15s ease;
}
.done .check { background: var(--blue); border-color: var(--blue); }
.done .row-title { color: var(--label-2); text-decoration: line-through; text-decoration-color: var(--label-3); }

/* ---------- day card ---------- */
.day-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 0 16px 7px; gap: 10px;
}
.day-name { font-size: 20px; font-weight: 600; letter-spacing: -0.016em; }
.day-meta { font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.today-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--blue); margin-left: 7px; vertical-align: middle;
}
.slot { font-size: 13px; color: var(--label-2); width: 62px; flex: 0 0 auto; }

.tag {
  display: inline-block; font-size: 12px; font-weight: 500;
  padding: 2px 7px; border-radius: 6px; background: var(--fill);
  color: var(--label-2); letter-spacing: -0.004em;
}
.tag.cook { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.tag.run { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.tag.yoga { background: color-mix(in srgb, var(--purple) 16%, transparent); color: var(--purple); }

/* ---------- freshness ---------- */
.bar { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; border-radius: 2px; background: var(--green); }
.bar.warn > i { background: var(--orange); }
.bar.late > i { background: var(--red); }
.covers { font-size: 13px; color: var(--label-2); margin-top: 6px; }

/* ---------- segmented ---------- */
.segmented {
  display: flex; gap: 2px; padding: 2px;
  background: var(--fill); border-radius: 9px; margin-bottom: 18px;
}
.segmented button {
  flex: 1; min-height: 32px; border-radius: 7px;
  font-size: 13px; font-weight: 500; color: var(--label);
}
.segmented button[aria-selected="true"] {
  background: var(--card); font-weight: 600;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
}

/* ---------- stepper ---------- */
.stepper { display: flex; align-items: center; background: var(--fill); border-radius: 8px; overflow: hidden; }
.stepper button { width: 40px; height: 32px; font-size: 19px; line-height: 1; }
.stepper span { width: 34px; text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; }

/* ---------- sheet ---------- */
.scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  opacity: 0; pointer-events: none; transition: opacity .28s ease; z-index: 40;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--bg);
  border-radius: 12px 12px 0 0;
  transform: translateY(100%);
  transition: transform .34s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.open { transform: translateY(0); }
.sheet-bar {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; gap: 12px;
  background: var(--tabbar);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid var(--separator);
}
.sheet-title { font-size: 17px; font-weight: 600; letter-spacing: -0.014em; }
.sheet-done { color: var(--blue); font-weight: 600; font-size: 17px; min-height: 44px; padding: 0 4px; }
.sheet-body { padding: 18px 16px 40px; max-width: 640px; margin: 0 auto; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); margin: 6px auto 0; }
@media (min-width: 700px) {
  .sheet { left: 50%; right: auto; transform: translate(-50%, 100%); width: 640px; border-radius: 12px; bottom: 20px; max-height: 88vh; }
  .sheet.open { transform: translate(-50%, 0); }
}

.recipe-meta { color: var(--label-2); font-size: 15px; margin-bottom: 20px; }
.recipe-h { font-size: 13px; color: var(--label-2); margin: 0 0 7px 16px; }
.ing { display: flex; justify-content: space-between; gap: 16px; }
.ing .q { color: var(--label-2); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step-n {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
  background: var(--fill); color: var(--label-2);
  font-size: 12px; font-weight: 600; display: grid; place-items: center;
  margin-top: 1px; font-variant-numeric: tabular-nums;
}
.note {
  background: var(--card); border-radius: var(--radius-lg);
  padding: 14px 16px; font-size: 15px; color: var(--label-2);
  border-left: 3px solid var(--orange);
}

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex;
  background: var(--tabbar);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--separator);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; min-height: 49px; font-size: 10px; color: var(--label-2); letter-spacing: -0.002em;
}
.tabbar button[aria-current="page"] { color: var(--blue); }
.tab-glyph { font-size: 17px; }

@media (min-width: 900px) {
  .sidebar { display: block; }
  .tabbar { display: none; }
  .main { padding-bottom: 48px; }
  .container { padding: 0 28px; max-width: 760px; margin: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}
.hidden { display: none; }

/* ---------- immersive wash + view transition ---------- */
.main { position: relative; }
.main::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 280px;
  background: radial-gradient(120% 100% at 20% 0%, color-mix(in srgb, var(--blue) 16%, transparent), transparent 70%);
  pointer-events: none; z-index: 0;
}
body[data-tab="tonight"] .main::before { background: radial-gradient(120% 100% at 20% 0%, color-mix(in srgb, var(--orange) 16%, transparent), transparent 70%); }
body[data-tab="batches"] .main::before { background: radial-gradient(120% 100% at 20% 0%, color-mix(in srgb, var(--green) 16%, transparent), transparent 70%); }
body[data-tab="recipes"] .main::before { background: radial-gradient(120% 100% at 20% 0%, color-mix(in srgb, var(--purple) 16%, transparent), transparent 70%); }
body[data-tab="trends"] .main::before { background: radial-gradient(120% 100% at 20% 0%, color-mix(in srgb, var(--purple) 16%, transparent), transparent 70%); }
.container { position: relative; z-index: 1; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
#view.view-anim { animation: viewIn .22s ease; }

/* ---------- activity rings ---------- */
.ring-row { display: flex; gap: 22px; align-items: center; padding: 6px 0 4px; flex-wrap: wrap; }
.ring-item { display: flex; align-items: center; gap: 12px; }
.ring svg { transform: rotate(-90deg); }
.ring circle { fill: none; }
.ring .track { stroke: var(--fill); }
.ring .fill { stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ring-label { line-height: 1.25; }
.ring-value { font-size: 17px; font-weight: 700; letter-spacing: -0.014em; }
.ring-sub { font-size: 12px; color: var(--label-2); }

/* ---------- stat tiles / KPI row ---------- */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat-tile { background: var(--card); border-radius: var(--radius-lg); padding: 14px 14px 12px; }
.stat-label { font-size: 12px; color: var(--label-2); margin-bottom: 6px; letter-spacing: -0.006em; }
.stat-value { font-size: 22px; font-weight: 700; letter-spacing: -0.018em; }
.stat-tile.accent .stat-value { color: var(--orange); }
.stat-sub { font-size: 12px; color: var(--label-3); margin-top: 2px; }

/* ---------- line chart ---------- */
.chart-wrap { background: var(--card); border-radius: var(--radius-lg); padding: 14px 14px 10px; margin-bottom: 12px; }
.chart-title-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 10px; }
.chart-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.chart-delta { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--label-2); flex: 0 0 auto; }
.chart-delta.good { color: var(--green); }
.chart-delta.bad { color: var(--red); }
.chart-svg-wrap { position: relative; }
.chart-svg-wrap svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .gridline { stroke: var(--separator); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--blue); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart .area { fill: var(--blue); opacity: 0.10; }
.chart .dot { fill: var(--blue); stroke: var(--card); stroke-width: 2; }
.chart .endlabel { font-size: 11px; fill: var(--label-2); font-variant-numeric: tabular-nums; }
.chart .hoverline { stroke: var(--label-3); stroke-width: 1; stroke-dasharray: 2 2; }
.chart-empty { color: var(--label-2); font-size: 14px; padding: 18px 2px; }
.chart-tooltip {
  position: absolute; pointer-events: none; background: var(--card-alt);
  border: 0.5px solid var(--separator); border-radius: 8px; padding: 6px 9px;
  font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.16); white-space: nowrap;
  transform: translate(-50%, -112%); opacity: 0; transition: opacity .1s ease; z-index: 2;
}
.chart-tooltip.show { opacity: 1; }

/* ---------- mood picker ---------- */
.mood-row { display: flex; gap: 8px; margin-bottom: 4px; }
.mood-btn {
  flex: 1; min-height: 56px; border-radius: 12px; background: var(--fill);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 22px;
}
.mood-btn .mood-label { font-size: 11px; color: var(--label-2); }
.mood-btn[aria-pressed="true"] { background: var(--blue); }
.mood-btn[aria-pressed="true"] .mood-label { color: rgba(255,255,255,0.85); }

/* ---------- text fields ---------- */
.field-row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; border-bottom: 0.5px solid var(--separator); }
.field-row:last-child { border-bottom: 0; }
.field-label { flex: 0 0 auto; }
.field-input, .field-textarea {
  flex: 1 1 auto; text-align: right; border: 0; background: transparent; color: var(--label);
  font: inherit; font-variant-numeric: tabular-nums; min-height: 22px; padding: 0;
}
.field-textarea { text-align: left; resize: none; font-variant-numeric: normal; }
.field-input::placeholder, .field-textarea::placeholder { color: var(--label-3); }
.field-go { flex: 0 0 auto; color: var(--blue); font-weight: 600; min-height: 44px; padding: 0 2px; }
.field-go:disabled { color: var(--label-3); }

/* ---------- calendar ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 10px; }
.cal-month { font-size: 15px; font-weight: 600; }
.cal-nav button { min-width: 32px; min-height: 32px; font-size: 17px; color: var(--blue); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 16px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--label-2); padding-bottom: 4px; }
.cal-cell {
  aspect-ratio: 1; border-radius: 9px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px; font-size: 12px;
  background: var(--fill-2); position: relative;
}
.cal-cell.empty { background: transparent; }
.cal-cell.today { box-shadow: inset 0 0 0 2px var(--blue); }
.cal-daynum { color: var(--label-2); font-variant-numeric: tabular-nums; }
.cal-cell.followed .cal-daynum { color: var(--label); font-weight: 600; }
.cal-mood { font-size: 13px; line-height: 1; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); position: absolute; bottom: 5px; }
.cal-legend { display: flex; gap: 14px; padding: 10px 16px 0; font-size: 12px; color: var(--label-2); flex-wrap: wrap; }
.cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
.cal-legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" aria-label="Sections">
    <h1>Meal Plan</h1>
    <div id="sidenav"></div>
  </nav>

  <main class="main">
    <div class="container" id="view"></div>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grabber"></div>
  <div class="sheet-bar">
    <span class="sheet-title" id="sheetTitle"></span>
    <button class="sheet-done" id="sheetDone">Done</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<script>
"use strict";

/* Running inside the Tauri shell: clear the traffic lights under the
   overlay title bar. No-op in a plain browser. */
if (window.__TAURI__) {
  document.documentElement.classList.add("is-desktop");
}

/* =========================================================
   DATA
   Week 1. Calories are per person, one serving.
   ========================================================= */

const RECIPES = {
  idli: {
    title: "Fermented idli batter",
    meta: "About 30 idlis. Grind Saturday night, ready Sunday morning.",
    yieldServes: 2,
    ingredients: [
      ["Idli rice", "3 cups"], ["Urad dal", "1 cup"], ["Thick poha", "1/2 cup"],
      ["Salt", "2 tsp"], ["Fenugreek seeds", "1 tsp"]
    ],
    steps: [
      "Soak the rice and poha in one bowl, the urad dal and fenugreek in another, for 5 hours.",
      "Grind the urad dal first with cold water until light and airy. Then grind the rice to a slightly coarse paste.",
      "Combine, add salt, mix with your hand. Leave covered at room temperature overnight.",
      "Steam in lots of 6. Twelve minutes, then rest 2 minutes before unmoulding."
    ],
    note: "Batter holds through Thursday. Reheat six idlis for 90 seconds in the microwave with a damp cloth over them. Anything left after Thursday goes to uttapam, not idli."
  },
  chutney: {
    title: "Peanut chutney",
    meta: "Keeps 4 days. Coconut chutney only keeps 2, which is why this is the default.",
    yieldServes: 2,
    ingredients: [
      ["Roasted peanuts", "1 cup"], ["Dried red chillies", "3"], ["Garlic", "4 cloves"],
      ["Tamarind", "thumbnail piece"], ["Salt", "to taste"],
      ["Mustard seeds", "1/2 tsp"], ["Curry leaves", "1 sprig"], ["Oil", "1 tsp"]
    ],
    steps: [
      "Grind peanuts, chillies, garlic, tamarind and salt with enough water for a thick paste.",
      "Temper mustard seeds, curry leaves and a pinch of hing in the oil, pour over."
    ],
    note: "Fresh batch on Sunday covers through Wednesday. Second batch Wednesday covers Friday and Saturday."
  },
  rajma: {
    title: "Rajma",
    meta: "Sunday night. Covers three meals.",
    yieldServes: 2,
    ingredients: [
      ["Rajma, soaked overnight", "2 cups"], ["Onion", "3, finely chopped"],
      ["Tomato", "4, pureed"], ["Ginger garlic paste", "2 tbsp"],
      ["Oil", "2 tbsp"], ["Turmeric", "1 tsp"], ["Coriander powder", "2 tsp"],
      ["Red chilli powder", "1.5 tsp"], ["Garam masala", "1 tsp"], ["Rajma masala", "2 tsp"]
    ],
    steps: [
      "Pressure cook the soaked rajma with salt, 6 whistles. Keep the cooking water.",
      "Brown the onions properly in the oil. Pale onions make flat rajma.",
      "Add ginger garlic paste, then the tomato puree and dry spices. Cook until the oil separates.",
      "Add the rajma with its water. Simmer 20 minutes, mashing a ladleful against the side to thicken."
    ],
    note: "Wednesday's portion goes to the freezer on Sunday night, not the fridge. Move it down Tuesday evening."
  },
  chana: {
    title: "Chana masala",
    meta: "Wednesday night. Covers Thursday and Friday lunch, plus Thursday's cold salad.",
    yieldServes: 2,
    ingredients: [
      ["Kabuli chana, soaked overnight", "2 cups"], ["Onion", "3, finely chopped"],
      ["Tomato", "4, pureed"], ["Ginger garlic paste", "2 tbsp"], ["Oil", "2 tbsp"],
      ["Chana masala", "2 tsp"], ["Amchur", "1 tsp"], ["Black tea bag", "1"]
    ],
    steps: [
      "Pressure cook the chana with salt and the tea bag, 6 whistles. Remove the bag.",
      "Same onion tomato base as the rajma.",
      "Add the chana with a cup of its water, simmer 15 minutes, finish with amchur."
    ],
    note: "Hold back a cup of plain boiled chana before it goes into the masala. That is Thursday's dinner salad."
  },
  dal: {
    title: "Dal tadka",
    meta: "Friday night. Covers Saturday lunch.",
    yieldServes: 2,
    ingredients: [
      ["Toor dal", "1.5 cups"], ["Turmeric", "1 tsp"], ["Ghee", "1.5 tbsp"],
      ["Cumin seeds", "1 tsp"], ["Garlic", "8 cloves, sliced"],
      ["Dried red chilli", "2"], ["Tomato", "1, chopped"], ["Lemon", "half"]
    ],
    steps: [
      "Pressure cook the dal with turmeric and salt, 3 whistles. Whisk smooth.",
      "Heat the ghee, add cumin, then garlic until golden, then chilli, hing and tomato.",

function isoDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function todayIso() { return isoDate(new Date()); }
function addDaysIso(iso, n) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return isoDate(d);
}
function shortDate(iso) {
  return new Date(iso + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function dailyEntry(iso) {
  return state.dailyLog[iso] || null;
}
function logToday(patch) {
  const iso = todayIso();
  state.dailyLog[iso] = Object.assign({}, state.dailyLog[iso], patch);
  save();
  syncTray();
}
function weekAvgKcal() {
  const total = DAYS.reduce(function (s, d) { return s + dayTotal(d); }, 0);
  return Math.round(total / DAYS.length);
}
function targetDailyKcal() {
  return state.targetDailyKcal || weekAvgKcal();
}
function followedLastNDays(n) {
  let count = 0;
  for (let i = 0; i < n; i++) {
    const e = dailyEntry(addDaysIso(todayIso(), -i));
    if (e && e.planFollowed) count++;
  }
  return count;
}
function computeStreak() {
  let cursor = todayIso();
  const today = dailyEntry(cursor);
  if (!today || !today.planFollowed) cursor = addDaysIso(cursor, -1);
  let n = 0;
  while (true) {
    const e = dailyEntry(cursor);
    if (e && e.planFollowed) { n++; cursor = addDaysIso(cursor, -1); } else { break; }
  }
  return n;
}
function followedDays() {
  return Object.keys(state.dailyLog).filter(function (iso) { return state.dailyLog[iso].planFollowed; });
}
/* Calories saved is (your target − this week's average planned day) for
   every day you mark the plan followed. It is a credit against a target
   you set, not a measurement of what you actually ate. */
function caloriesSavedTotal() {
  const perDay = Math.max(0, targetDailyKcal() - weekAvgKcal());
  return perDay * followedDays().length;
}
/* Nutrition earned is a fixed estimate per activity you confirm for the
   day (see ACTIVITY_CREDIT) — manual until this reads real workout data. */
function nutritionEarnedTotal() {
  let n = 0;
  Object.keys(state.dailyLog).forEach(function (iso) {
    const a = state.dailyLog[iso].activity;
    if (a && ACTIVITY_CREDIT[a] != null) n += ACTIVITY_CREDIT[a];

  return n;
}
function weightEntries() {
  return Object.keys(state.dailyLog)

function cheatEntries() {

function ringSvg(percent, colorVar, size, stroke) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(1, percent));
  const svgns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgns, "svg");
  svg.setAttribute("class", "ring");
  svg.setAttribute("width", size); svg.setAttribute("height", size);
  svg.setAttribute("viewBox", "0 0 " + size + " " + size);
  const track = document.createElementNS(svgns, "circle");
  track.setAttribute("class", "track");
  track.setAttribute("cx", size / 2); track.setAttribute("cy", size / 2); track.setAttribute("r", r);
  track.setAttribute("stroke-width", stroke);
  svg.appendChild(track);
  const fill = document.createElementNS(svgns, "circle");
  fill.setAttribute("class", "fill");
  fill.setAttribute("cx", size / 2); fill.setAttribute("cy", size / 2); fill.setAttribute("r", r);
  fill.setAttribute("stroke-width", stroke);
  fill.style.stroke = "var(" + colorVar + ")";
  fill.setAttribute("stroke-dasharray", c.toFixed(2));
  fill.setAttribute("stroke-dashoffset", (c * (1 - clamped)).toFixed(2));
  svg.appendChild(fill);
  return svg;
}
function ringItem(percent, colorVar, value, sub) {
  const item = el("div", "ring-item");
  item.appendChild(ringSvg(percent, colorVar, 56, 6));
  const label = el("div", "ring-label");
  label.appendChild(el("div", "ring-value", value));
  label.appendChild(el("div", "ring-sub", sub));
  item.appendChild(label);
  return item;
}

function lineChartCard(title, points, targetValue, unit) {
  const card = el("div", "chart-wrap");
  const head = el("div", "chart-title-row");
  head.appendChild(el("div", "chart-title", title));
  if (points.length >= 2) {
    const delta = points[points.length - 1].value - points[0].value;
    const goodDown = unit === "kg" && targetValue != null && targetValue < points[0].value;
    const cls = delta === 0 ? "" : ((goodDown ? delta < 0 : delta > 0) ? " good" : " bad");
    head.appendChild(el("span", "chart-delta" + cls,
      (delta > 0 ? "+" : "") + delta.toFixed(1) + " " + unit + " since first log"));
  }
  card.appendChild(head);

  if (points.length < 2) {
    card.appendChild(el("div", "chart-empty", "Log at least two days to see a trend."));
    return card;
  }

  const w = 600, h = 160, padX = 8, padY = 16;
  const values = points.map(function (p) { return p.value; });
  if (targetValue != null) values.push(targetValue);
  let min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.12;
  min -= pad; max += pad;

  function xAt(i) { return padX + (i / (points.length - 1)) * (w - padX * 2); }
  function yAt(v) { return h - padY - ((v - min) / (max - min)) * (h - padY * 2); }

  const svgns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgns, "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.setAttribute("class", "chart");
  svg.setAttribute("preserveAspectRatio", "none");

  if (targetValue != null) {
    const gl = document.createElementNS(svgns, "line");
    gl.setAttribute("class", "gridline");
    gl.setAttribute("x1", padX); gl.setAttribute("x2", w - padX);
    gl.setAttribute("y1", yAt(targetValue).toFixed(1)); gl.setAttribute("y2", yAt(targetValue).toFixed(1));
    gl.setAttribute("stroke-dasharray", "3 3");
    svg.appendChild(gl);
  }

  let dPath = "";
  points.forEach(function (p, i) {
    dPath += (i === 0 ? "M" : "L") + xAt(i).toFixed(1) + "," + yAt(p.value).toFixed(1) + " ";
  });
  dPath = dPath.trim();
  const aPath = "M" + xAt(0).toFixed(1) + "," + (h - padY).toFixed(1) + " L" + dPath.slice(1) +
    " L" + xAt(points.length - 1).toFixed(1) + "," + (h - padY).toFixed(1) + " Z";

  const area = document.createElementNS(svgns, "path");
  area.setAttribute("class", "area"); area.setAttribute("d", aPath);
  svg.appendChild(area);

  const line = document.createElementNS(svgns, "path");
  line.setAttribute("class", "line"); line.setAttribute("d", dPath);
  svg.appendChild(line);

  const lastPoint = points[points.length - 1];
  const endDot = document.createElementNS(svgns, "circle");
  endDot.setAttribute("class", "dot");
  endDot.setAttribute("cx", xAt(points.length - 1).toFixed(1));
  endDot.setAttribute("cy", yAt(lastPoint.value).toFixed(1));
  endDot.setAttribute("r", 4);
  svg.appendChild(endDot);

  const endLabel = document.createElementNS(svgns, "text");
  endLabel.setAttribute("class", "endlabel");
  endLabel.setAttribute("text-anchor", "end");
  endLabel.setAttribute("x", Math.max(30, xAt(points.length - 1) - 6).toFixed(1));
  endLabel.setAttribute("y", Math.max(10, yAt(lastPoint.value) - 8).toFixed(1));
  endLabel.textContent = lastPoint.value + " " + unit;
  svg.appendChild(endLabel);

  const hoverLine = document.createElementNS(svgns, "line");
  hoverLine.setAttribute("class", "hoverline");
  hoverLine.setAttribute("y1", padY); hoverLine.setAttribute("y2", h - padY);
  hoverLine.style.display = "none";
  svg.appendChild(hoverLine);

  const wrap = el("div", "chart-svg-wrap");
  wrap.appendChild(svg);
  const tooltip = el("div", "chart-tooltip");
  wrap.appendChild(tooltip);

  function showAt(clientX, rect) {
    const relX = ((clientX - rect.left) / rect.width) * w;
    let idx = 0, best = Infinity;
    points.forEach(function (p, i) {
      const d = Math.abs(xAt(i) - relX);
      if (d < best) { best = d; idx = i; }
    });
    const px = xAt(idx), py = yAt(points[idx].value);
    hoverLine.setAttribute("x1", px.toFixed(1)); hoverLine.setAttribute("x2", px.toFixed(1));
    hoverLine.style.display = "block";
    tooltip.textContent = shortDate(points[idx].date) + " · " + points[idx].value + " " + unit;
    tooltip.style.left = ((px / w) * rect.width) + "px";
    tooltip.style.top = ((py / h) * rect.height) + "px";
    tooltip.classList.add("show");
  }
  function hide() { hoverLine.style.display = "none"; tooltip.classList.remove("show"); }

  wrap.addEventListener("pointermove", function (e) { showAt(e.clientX, wrap.getBoundingClientRect()); });
  wrap.addEventListener("pointerleave", hide);
  wrap.addEventListener("pointerdown", function (e) { showAt(e.clientX, wrap.getBoundingClientRect()); });

  card.appendChild(wrap);
  return card;
}

    const cl2 = el("div", "list");
    entries.slice(0, 10).forEach(function (c) {
      const row = el("div", "row");
      const main = el("div", "row-main");
      main.appendChild(el("div", "row-title", c.item));
      main.appendChild(el("div", "row-sub", shortDate(c.date)));
      row.appendChild(main);
      cl2.appendChild(row);
    });
    chg.appendChild(cl2);
  } else {
    chg.appendChild(el("p", "group-footer", "None logged yet. Use the box under Today above when it happens — no judgment, just the record."));
  }
  view.appendChild(chg);

  const calG = el("div", "group");
  calG.appendChild(el("div", "group-header", "Calendar"));
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const head = el("div", "cal-head");
  head.appendChild(el("div", "cal-month", now.toLocaleDateString(undefined, { month: "long", year: "numeric" })));
  calG.appendChild(head);

  const grid = el("div", "cal-grid");
  ["S", "M", "T", "W", "T", "F", "S"].forEach(function (d) { grid.appendChild(el("div", "cal-dow", d)); });
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  for (let i = 0; i < startWeekday; i++) grid.appendChild(el("div", "cal-cell empty"));
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = isoDate(new Date(year, month, day));
    const dEntry = dailyEntry(iso);
    const cell = el("div", "cal-cell" + (iso === today ? " today" : "") + (dEntry && dEntry.planFollowed ? " followed" : ""));
    cell.appendChild(el("div", "cal-daynum", String(day)));
    if (dEntry && dEntry.mood) {
      const moodDef = MOODS.find(function (m) { return m.id === dEntry.mood; });
      if (moodDef) cell.appendChild(el("div", "cal-mood", moodDef.emoji));
    }
    if (dEntry && dEntry.planFollowed) cell.appendChild(el("div", "cal-dot"));
    grid.appendChild(cell);
  }
  calG.appendChild(grid);

  const legend = el("div", "cal-legend");
  const l1 = el("span");
  const dot1 = el("i"); dot1.style.background = "var(--green)";
  l1.appendChild(dot1); l1.appendChild(document.createTextNode("Plan followed"));
  legend.appendChild(l1);
  calG.appendChild(legend);
  view.appendChild(calG);
}

const VIEWS = {
  week: renderWeek,
  tonight: renderTonight,
  batches: renderBatches,
  recipes: renderRecipes,
  shopping: renderShopping,
  trends: renderTrends
};

/* =========================================================
   NAV
   ========================================================= */

function buildNav() {
  const side = document.getElementById("sidenav");
  const tabbar = document.getElementById("tabbar");
  side.innerHTML = "";
  tabbar.innerHTML = "";

  TABS.forEach(function (t) {
    const s = el("button", "side-item");
    s.type = "button";
    s.appendChild(el("span", "side-glyph", t.glyph));
    s.appendChild(el("span", null, t.label));
    if (state.tab === t.id) s.setAttribute("aria-current", "page");
    s.addEventListener("click", function () { go(t.id); });
    side.appendChild(s);

    const b = el("button");
    b.type = "button";
    b.appendChild(el("span", "tab-glyph", t.glyph));
    b.appendChild(el("span", null, t.label));
    if (state.tab === t.id) b.setAttribute("aria-current", "page");
    b.addEventListener("click", function () { go(t.id); });
    tabbar.appendChild(b);
  });
}

function go(id) {
  state.tab = id;
  save();
  render();
  window.scrollTo(0, 0);
}

function render() {
  view.innerHTML = "";
  document.body.dataset.tab = state.tab;
  (VIEWS[state.tab] || renderWeek)();
  buildNav();
  view.classList.remove("view-anim");
  void view.offsetWidth;
  view.classList.add("view-anim");
  syncTray();
}

render();
</script>
</body>
</html>
